<body class="w3-content">

<!-- /header.html -->
<div id="menu-placeholder"></div>

<!-- main -->
<main class="w3-container w3-center">

<!-- 2026.10.12. github-ra-ra -->
<div class="w3-large w3-bold w3-padding">
 Kutyáink
</div>

<div class="w3-blue w3-medium">
    <span class="w3-btn" onclick="firstpic()">&lt;&lt;</span> &#32;
    <span class="w3-btn" onclick="prevpic()">&lt;</span> &#32;
    <b id="picnum"> 1 </b> &#32;
    <span class="w3-btn" onclick="nextpic()">&gt;</span> &#32;
    <span class="w3-btn" onclick="lastpic()">&gt;&gt;</span> &#32;
</div>
  
<img id="kutyakep" class="w3-image w3-round w3-padding-16" src="/img/kutyak/01.jpg" alt="kutyaink" onclick="randompic()"><br>

<script>
"use strict";

const picpath='/img/kutyak/';
const lastpici=52;

let picindex=1;

randompic();

function randompic()
{
 picindex = Math.floor(Math.random() * lastpici) + 1;
 setpic();
}

function firstpic()
{
  picindex=1;
  setpic();
}

function lastpic()
{
  picindex=lastpici;
  setpic();
}

function prevpic()
{
  if (picindex>1) { picindex--; } else { picindex=lastpici; }
  setpic();
}

function nextpic()
{
  if (picindex<lastpici) { picindex++; } else { picindex=1; }
  setpic();
}

function setpic()
{
 let picstr=picpath + picindex.toString().padStart(2, "0") + '.jpg';
 document.getElementById("kutyakep").src =  picstr;
 document.getElementById("picnum").innerHTML= lastpici +' / ' + picindex;
}

</script>

</main>
